<title>Set Status Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the Notch app shell from the Cases Figma (9666:30734, 9642:162827): 48px icon rail, white rounded app panel,
   case list + case page; Agents → "Agent behavior" card (Agents Figma 12720:539896). Colors are the repo's figmaPrimitives.
   Single light look on purpose: it mirrors the product, which ships light. */
:root {
  color-scheme: light;
  --shell: #F2F4F7;            /* gray.100 */
  --panel: #FFFFFF;
  --line: #EAECF0;             /* gray.200 */
  --line-2: #E4E7EC;           /* gray.250 */
  --line-3: #D0D5DD;           /* gray.300 */
  --fg: #1D2939;               /* gray.800 */
  --fg-2: #475467;             /* gray.600 */
  --fg-3: #667085;             /* gray.500 */
  --fg-4: #98A2B3;             /* gray.400 */
  --hover: #F9FAFB;            /* gray.50 */
  --brand: #F04B0F;            /* brand.500 */
  --brand-tint: #FFF8F0;       /* brand.100 */
  --blue-fg: #1570EF; --blue-bg: #EFF4FF; --blue-line: #C8D8FF;
  --err-fg: #E7000B; --err-bg: #FFE2E2;
  --warn-fg: #C44C21; --warn-bg: #FEFAEA; --warn-line: #FFF0D1;
  --ok-fg: #039855; --ok-bg: #E5F7EF;
  --fuchsia: #A638E6; --fuchsia-line: #D9B0FB;
  --mint: #008F88; --mint-line: #A8DCD9;
  --purple: #8068F0;
  --group-bg: #F9F8F6; --group-rule: #E1D5C8;
  --dot-doc: #5B6F94; --dot-email: #C08A5B; --dot-call: #5E9E86; --dot-action: #7A6AA8;
  --shadow: 0 4px 6px -2px rgba(16,24,40,.05), 0 12px 16px -4px rgba(16,24,40,.10);
  --font: 'Inter', 'Rubik', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--shell); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue-fg); outline-offset: 2px; }
svg { flex-shrink: 0; }

.app { display: flex; height: 100%; padding-block: 8px; padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-left: env(safe-area-inset-left, 0px); }
.rail { width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px; }
.rail .logo { width: 26px; height: 26px; border-radius: 50%; background: #12B5A6; display: grid; place-items: center; margin-bottom: 14px; }
.rail-btn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--fg-2); display: grid; place-items: center; }
.rail-btn:hover { background: var(--line); }
.rail-btn.active { background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,.06); color: var(--fg); }
.rail .spacer { flex: 1; }
.rail .adam { width: 24px; height: 24px; border-radius: 6px; background: #1D2939; display: grid; place-items: center; margin-bottom: 8px; }

.panel { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.panel-top { height: 58px; flex-shrink: 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 20px; }
.panel-top .t { font-size: 14px; font-weight: 500; }
.proto-tag { font-size: 11px; font-weight: 500; color: var(--warn-fg); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 9999px; padding: 2px 10px; white-space: nowrap; }
.panel-body { flex: 1; min-height: 0; display: flex; }

/* ---------- chips ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; padding: 2px 8px; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 18px; }
.t-require_action, .t-sev-high { color: var(--err-fg); background: var(--err-bg); }
.t-pending, .t-sev-medium { color: var(--warn-fg); background: var(--warn-bg); }
.t-sev-medium { background: #FFF0D1; }
.t-closed, .t-sev-low { color: var(--ok-fg); background: var(--ok-bg); }
.t-new, .t-processing { color: var(--blue-fg); background: var(--blue-bg); }
.t-none { color: var(--fg-2); background: var(--shell); }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.list-tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 9999px; padding: 1px 8px 1px 7px; font-size: 12px; color: var(--fg); }
.list-tag i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.pill-btn { border: 0; background: none; padding: 0; border-radius: 9999px; display: inline-flex; }
.pill-btn .tag { padding-right: 6px; }
.pill-btn:disabled { cursor: default; }
.pill-btn:not(:disabled):hover .tag { filter: brightness(.97); }
.new-mark { font-size: 10px; font-weight: 600; color: var(--brand); background: var(--brand-tint); border-radius: 4px; padding: 0 5px; letter-spacing: .02em; }

/* ---------- case list ---------- */
.cases { width: 320px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.cases-h { height: 50px; display: flex; align-items: center; justify-content: space-between; padding-inline: 20px; border-bottom: 1px solid var(--line); }
.cases-h .ttl { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.count { font-size: 12px; background: var(--shell); border-radius: 6px; padding: 1px 7px; color: var(--fg-2); }
.icons { display: flex; gap: 14px; color: var(--fg-2); }
.overview { margin: 12px 12px 6px; display: flex; align-items: center; gap: 10px; background: var(--shell); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.case-items { overflow-y: auto; border-top: 1px solid var(--line); margin-top: 6px; }
.case-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 20px; border-left: 2px solid transparent; }
.case-item:hover { background: var(--hover); }
.case-item.active { background: var(--hover); border-left-color: var(--brand); }
.ci-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ci-name { font-size: 14px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci-time { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.ci-sub { margin-top: 6px; }

/* ---------- case page ---------- */
.case { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 30px 120px; display: flex; flex-direction: column; gap: 14px; }
.case-title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.case-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.case-title h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.case-meta { display: flex; align-items: center; gap: 12px; color: var(--fg-2); font-size: 13px; }
.round-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #FFF; display: grid; place-items: center; color: var(--fg-2); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: #FFF; border-radius: 9999px; padding: 5px 12px; font-size: 14px; color: var(--fg); }
.tab.active { background: var(--shell); border-color: var(--line-3); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--fg-3); }
.kpi .v { font-size: 16px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card { border: 1px solid var(--line-2); border-radius: 10px; background: #FFF; }
.summary { padding: 14px 16px; }
.summary .h { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 14px; margin-bottom: 6px; }
.summary p { margin: 0; font-size: 14px; line-height: 1.55; }

/* timeline */
.tl-card { padding: 18px 16px 14px; position: relative; }
.tl-scroll { overflow-x: auto; }
.tl { position: relative; min-width: 640px; height: 170px; }
.tl-col { position: absolute; top: 0; bottom: 34px; border-left: 1px dashed var(--line-3); }
.tl-col span { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--fg-3); white-space: nowrap; background: #FFF; padding-inline: 4px; }
.tl-axis { position: absolute; left: 0; right: 0; top: 96px; height: 1px; background: var(--line-3); }
.tl-dot { position: absolute; top: 89px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #FFF; box-shadow: 0 0 0 1px rgba(16,24,40,.08); padding: 0; transform: translateX(-50%); }
.tl-dot.sel { box-shadow: 0 0 0 2px var(--fg); }
.tl-dot.status { background: var(--fg); }
.tl-flag { position: absolute; top: 58px; transform: translateX(-50%); padding: 0; border: 0; background: none; }
.tl-flag .tag { font-size: 11px; padding: 1px 7px; }
.legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.tip { position: absolute; z-index: 15; width: 330px; max-width: calc(100vw - 32px); background: #FFF; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tip-h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.tip-h b { font-weight: 500; }
.badge-n { font-size: 11px; color: var(--fg-2); background: var(--shell); border-radius: 6px; padding: 1px 6px; }
.tip-sec { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.tip-sec .k { font-size: 11px; color: var(--fg-3); }
.tip-row { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 8px; font-size: 13px; align-items: start; }
.tip-row .tm { color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.chg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.who { font-size: 12px; color: var(--fg-3); }
.arrow { color: var(--fg-2); }

/* status / severity menu (mirrors Figma 9642:162827 and 9658:170173) */
.anchor { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 296px; max-width: calc(100vw - 32px); background: #FFF; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; }
.seg { display: flex; background: var(--shell); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 5px 8px; font-size: 14px; color: var(--fg-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: #FFF; color: var(--fg); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
.opts { display: flex; flex-direction: column; padding-top: 6px; }
.opt { display: flex; align-items: center; justify-content: space-between; border: 0; background: none; border-radius: 6px; padding: 8px; }
.opt:hover { background: var(--hover); }
.opt .ck { color: var(--brand); }
.menu-foot { border-top: 1px solid var(--line); margin-top: 4px; padding: 10px 8px 4px; font-size: 12px; color: var(--fg-3); }
.acts { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; max-height: 330px; overflow-y: auto; }
.act { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.act-h { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.act-h .time { font-size: 12px; color: var(--fg-3); }
.avatar { width: 18px; height: 18px; border-radius: 50%; background: #8A6A55; display: inline-grid; place-items: center; color: #FFF; font-size: 9px; font-weight: 600; }
.avatar.bot { background: var(--fuchsia); }
.avatar.sys { background: var(--fg-4); }
.act-what { font-size: 14px; }
.act .reason { font-size: 12px; color: var(--fg-2); font-style: italic; }

/* run history list */
.runs { padding: 4px 16px; }
.run-row { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.run-row:last-child { border-bottom: 0; }
.out { font-size: 11px; font-weight: 500; border-radius: 9999px; padding: 1px 8px; text-align: center; }
.o-ok { color: var(--ok-fg); background: var(--ok-bg); }
.o-kept { color: var(--fg-2); background: var(--shell); }
.o-fail { color: var(--err-fg); background: var(--err-bg); }
.o-run { color: var(--blue-fg); background: var(--blue-bg); }
.o-skip { color: var(--fg-3); background: #FFF; border: 1px solid var(--line-2); }

/* ---------- builder ---------- */
.builder { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 30px 140px; display: flex; flex-direction: column; gap: 16px; }
.agent-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.agent-h h1 { font-size: 20px; font-weight: 600; margin: 0; }
.agent-h .sub { color: var(--fg-3); font-size: 13px; }
.behavior { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 10px; max-width: 1000px; }
.behavior-h { display: flex; justify-content: space-between; align-items: flex-start; }
.behavior-h .t { font-size: 15px; font-weight: 500; }
.behavior-h .s { font-size: 13px; color: var(--fg-3); }
.steps { margin-top: 14px; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 6px; padding: 9px 8px; border-radius: 8px; align-items: start; font-size: 15px; line-height: 30px; }
.step:hover { background: var(--hover); }
.step .n { color: var(--fg-3); font-size: 14px; text-align: right; padding-right: 6px; }
.step.child { margin-left: 32px; }
.step .x { opacity: 0; border: 0; background: none; color: var(--fg-3); border-radius: 6px; line-height: 1; padding: 6px; }
.step:hover .x { opacity: 1; }
.step.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--brand-tint); } to { background: transparent; } }
.dotted { border-bottom: 1.5px dotted var(--fg-3); padding-bottom: 1px; }
.if-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-bg); color: var(--blue-fg); border-radius: 6px; padding: 0 7px; font-size: 13px; font-weight: 500; line-height: 24px; margin-right: 6px; }
.achip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--chip-line, var(--line-3)); border-radius: 9999px; padding: 0 10px 0 9px; height: 28px; font-size: 13px; background: #FFF; vertical-align: middle; margin-inline: 3px; line-height: 1; }
.achip .ic { color: var(--chip-c, var(--fg-2)); display: inline-flex; }
.achip .rm { color: var(--fg-3); font-size: 13px; margin-left: 2px; }
.achip.btn { cursor: pointer; }
.achip.btn:hover { background: var(--hover); }
.c-determine { --chip-c: var(--fuchsia); --chip-line: var(--fuchsia-line); }
.c-field { --chip-c: var(--brand); --chip-line: #FDD7B5; }
.c-route { --chip-c: var(--mint); --chip-line: var(--mint-line); }
.prompt-line { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 6px; padding: 9px 8px; color: var(--fg-4); font-size: 15px; position: relative; }
.prompt-line button { text-align: left; border: 0; background: none; color: var(--fg-4); padding: 0; }
.prompt-line .n { text-align: right; padding-right: 6px; font-size: 14px; }
.palette, .pick { color: var(--fg); position: absolute; z-index: 25; width: 300px; max-width: calc(100vw - 32px); background: #FFF; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; max-height: 380px; overflow-y: auto; }
.palette { left: 46px; top: 40px; }
.pal-grp { font-size: 12px; color: var(--fg-3); padding: 8px 8px 4px; }
.pal-it { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 6px; padding: 7px 8px; font-size: 14px; text-align: left; }
.pal-it:hover, .pal-it.kb { background: var(--hover); }
.pal-it .ic { width: 20px; display: inline-flex; justify-content: center; }
.pal-it .grow { flex: 1; }
.pal-it[aria-disabled="true"] { color: var(--fg-4); cursor: default; }
.pal-back { font-size: 12px; color: var(--fg-3); border: 0; background: none; padding: 6px 8px; }
.pick-sep { border-top: 1px solid var(--line); margin: 6px 0; }
.pick-note { font-size: 12px; color: var(--fg-3); padding: 4px 8px 6px; }
.why { max-width: 1000px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.why .card { padding: 12px 14px; font-size: 13px; color: var(--fg-2); }
.why .card b { color: var(--fg); font-weight: 500; display: block; margin-bottom: 4px; }

/* ---------- back-office agent page ---------- */
.stage { flex: 1; min-width: 0; display: flex; gap: 8px; }
.stage > .panel { flex: 1; }
.bx-side { width: 248px; flex-shrink: 0; background: #FFF; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 14.5px 3px rgba(160,160,160,.10); display: flex; flex-direction: column; overflow-y: auto; }
.bx-side-h { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 12px; }
.bx-side-h h2 { font-size: 18px; font-weight: 500; margin: 0; }
.bx-search { padding: 10px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: #737372; display: flex; gap: 8px; align-items: center; }
.bx-list { padding: 8px; display: grid; gap: 4px; }
.bx-list button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border: 0; background: none; border-radius: 8px; font-size: 14px; text-align: left; width: 100%; color: #1C1C1C; white-space: nowrap; }
.bx-list button:hover { background: var(--hover); }
.bx-list button.on { background: #F2F4F7; }
.adot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; background: radial-gradient(circle at 30% 30%, #7CE3F0, #0BA5C2); }
.adot.p { background: radial-gradient(circle at 30% 30%, #B7A8FF, #6A4FF0); } .adot.g { background: radial-gradient(circle at 30% 30%, #8BE3B1, #12B76A); }
.bx-main { flex: 1; min-width: 0; background: #FFF; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 14.5px 3px rgba(160,160,160,.10); display: flex; flex-direction: column; overflow: hidden; }
.bx-top { min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bx-crumb { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1C1C1C; }
.bx-crumb b { font-weight: 500; }
.bx-draft { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: #F4F4F4; color: #4F4F4F; }
.bx-saved { color: #737372; display: flex; align-items: center; gap: 6px; }
.bx-acts { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.bx-pub { height: 32px; padding: 0 14px; border-radius: 24px; background: #1C1C1C; color: #FFF; font-size: 12px; font-weight: 500; border: 0; display: inline-flex; align-items: center; gap: 6px; }
.bx-content { flex: 1; overflow-y: auto; padding: 32px 32px 200px; display: flex; flex-direction: column; gap: 16px; }
.bx-card { background: #FFF; border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: 0 4px 14.5px 3px rgba(160,160,160,.10); display: flex; flex-direction: column; gap: 20px; }
.bx-card-h { display: flex; align-items: flex-start; gap: 8px; }
.bx-card-h h3 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
.bx-card-h p { font-size: 14px; color: rgba(0,0,0,.6); margin: 0; }
.bx-card-h .chev { margin-left: auto; color: #1C1C1C; display: flex; gap: 14px; }
.bx-head { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px 16px; padding: 12px 20px; }
.bx-head h1 { font-size: 16px; font-weight: 600; margin: 0; }
.bx-mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #039855; background: #E5F7EF; border-radius: 999px; padding: 4px 10px; }
.bx-head .desc { color: #4F4F4F; font-size: 13.5px; }
.bx-collapsed { padding: 20px 24px; }
.bx-seq { display: flex; flex-direction: column; gap: 4px; margin-top: -4px; }
.srow { min-height: 52px; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 16px; position: relative; }
.srow:hover { background: #F8F8F8; }
.srow .n { width: 24px; text-align: right; color: #737372; font-size: 14px; flex-shrink: 0; }
.srow .more { margin-left: auto; opacity: 0; color: #737372; border: 0; background: none; }
.srow:hover .more { opacity: 1; }
.srow.flash { animation: flash 1.6s ease-out; }
.sent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; min-width: 0; color: #1C1C1C; }
.sent .muted { color: #737372; }

  // ============ BEHAVIOUR ============
  function record(to, by, actor, extra) {
    var c = S.c, from = c.status;
    if (from === to) return false;
    var ev = { day: c.day, time: now(), kind: 'status', from: from, to: to, by: by, actor: actor, reopen: from === 'closed' };
    for (var k in (extra || {})) ev[k] = extra[k];
    c.events.push(ev); c.status = to; return true;
  }
  function runSteps(seq, who, log) {
    var decided = false;
    seq.forEach(function (st, i) {
      if (st.type !== 'setStatus') return;
      var n = st.parent ? topNumber(seq, seq.findIndex(function (k) { return k.id === st.parent; })) + '.a' : topNumber(seq, i);
      if (st.cond === 'police' && S.sim.doc !== 'Police report') { log.push({ o: 'skip', t: who + ' · step ' + n + ' Set status: skipped, the document is not a police report' }); return; }
      if (!st.value) { log.push({ o: 'fail', t: who + ' · step ' + n + ' Set status: no status chosen' }); return; }
      var target, desc;
      if (st.value.kind === 'level') { target = st.value.key; desc = 'Set status (' + LABEL[target] + ')'; }
      else {
        var ans = S.sim.answer; desc = 'Set status from ' + st.value.variable + ', answer "' + ans + '"';
        target = matchStatus(ans);
        if (!target) { log.push({ o: 'fail', t: who + ' · step ' + n + ' ' + desc + ': no status matches the answer. Status not changed' }); return; }
      }
      var before = S.c.status;
      tick(1);
      if (record(target, who + ' · step ' + n, 'bot')) log.push({ o: 'ok', t: who + ' · step ' + n + ' ' + desc + ': ' + LABEL[before] + ' → ' + LABEL[target] + (before === 'closed' ? ' (case reopened)' : '') });
      else log.push({ o: 'kept', t: who + ' · step ' + n + ' ' + desc + ': already ' + LABEL[target] + ', nothing recorded' });
      decided = true;
    });
    return decided;
  }
  function run() {
    var c = S.c; tick(150);
    c.events.push({ day: c.day, time: now(), kind: S.sim.doc === 'Customer email' ? 'email' : 'doc', text: S.sim.doc });
    var wasClosed = c.status === 'closed';
    c.processing = true; S.menu = null; c.tip = null; render();
    setTimeout(function () {
      var log = []; tick(3);
      var a = runSteps(S.seq.manager, 'Case manager', log);
      var b = runSteps(S.seq.agent, AGENT, log);
      if (a || b) log.push({ o: 'run', t: 'Run finished. A step set the status, so the run keeps it' });
      else {
        var def = S.sim.next ? 'require_action' : 'pending';
        var ch = record(def, 'Notch · run finished, new document', 'sys');
        log.push({ o: 'run', t: 'Run finished. No step set the status → ' + LABEL[def] + (ch ? '' : ' (unchanged)') + (wasClosed && ch ? '. The new document reopened a Settled case' : '') });
      }
      c.processing = false; c.runlog = log; c.tip = c.day; render();
      toast(wasClosed && c.status !== 'closed' ? 'Case reopened: Settled → ' + LABEL[c.status] : 'Run finished · status ' + LABEL[c.status]);
    }, 1300);
  }
  function manual(k) {
    var c = S.c;

    if (c.status === 'closed') { S.menu = null; S.modal = { to: k }; render(); renderLayer(); setTimeout(function () { var t = document.getElementById('rr'); if (t) t.focus(); }, 0); return; }
    var from = c.status; tick(12); record(k, 'Maor Nakash', 'user'); S.menu = null; c.tip = c.day; render();
    toast('Status changed: ' + LABEL[from] + ' → ' + LABEL[k]);
  }

      '<div class="fl"><label for="rr">Reason (optional)</label><textarea id="rr" placeholder="e.g. Claimant disputed the settlement amount"></textarea></div></div>' +
      '<div class="modal-f"><button class="b" data-act="mclose">Cancel</button><button class="b primary" data-act="reopen">Reopen case</button></div></div></div>';

  function step(id) { var s = S.seq[S.surface]; for (var i = 0; i < s.length; i++) if (s[i].id === id) return s[i]; return null; }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) { if (!ev.target.closest('[data-stop]') && closeFloating()) render(); return; }
    var a = t.getAttribute('data-act'), v = t.getAttribute('data-val'), id = t.getAttribute('data-id');
    switch (a) {
      case 'go': S.view = v; closeFloating(); render(); break;
      case 'noop': toast('This prototype opens only the Case Manager and the ' + AGENT + ''); break;
      case 'surface': S.surface = v; closeFloating(); S.flashId = null; render(); break;
      case 'ctrl-min': S.ctrlMin = !S.ctrlMin; renderCtrl(); break;
      case 'slash': S.pickFor = null; S.palette = S.palette ? null : { stage: 'root' }; render(); break;
      case 'pal-status': S.palette = { stage: 'status' }; render(); break;
      case 'pal-back': S.palette = { stage: 'root' }; render(); break;
      case 'pick': if (ev.target.closest('.rm')) return; S.palette = null; S.pickFor = S.pickFor === id ? null : id; render(); break;
      case 'choose':
        var val = t.getAttribute('data-kind') === 'level' ? { kind: 'level', key: v } : { kind: 'determine', variable: v };
        var f = t.getAttribute('data-for');
        if (f === 'new') { var nid = 'n' + Date.now(); var arr = S.seq[S.surface]; var endAt = arr.length && /^(end|route)$/.test(arr[arr.length - 1].type) ? arr.length - 1 : arr.length; arr.splice(endAt, 0, { id: nid, type: 'setStatus', value: val }); S.flashId = nid; S.palette = null; }
        else { step(f).value = val; S.pickFor = null; }
        render(); break;
      case 'del': ev.stopPropagation(); S.seq[S.surface] = S.seq[S.surface].filter(function (s) { return s.id !== id; }); S.pickFor = null; render(); break;
      case 'menu': S.c.tip = null; S.menu = S.menu ? null : v; render(); break;
      case 'mtab': S.menu = v; render(); break;
      case 'manual': manual(v); break;
      case 'tab': S.c.tab = v; closeFloating(); render(); break;
      case 'tip': S.menu = null; S.c.tip = S.c.tip === +v ? null : +v; render(); break;
      case 'run': run(); break;
      case 'other':
        var o = S.others[+v];
        if (o.label === 'new' && !o.visited) { o.visited = true; render(); toast(o.name + ' opened: New is cleared for everyone. Status stays ' + LABEL[o.status] + ', set by the case manager before anyone opened it'); }
        else toast('This prototype opens only CLM-2026-0978');
        break;
      case 'mclose': if (ev.target.closest('.modal') && !ev.target.closest('button')) return; S.modal = null; renderLayer(); break;
      case 'reopen':
        var r = document.getElementById('rr'); tick(12);
        record(S.modal.to, 'Maor Nakash', 'user', { reason: r ? r.value.trim() : '' });
        S.modal = null; S.c.tip = S.c.day; render(); renderLayer(); toast('Case reopened: Settled → ' + LABEL[S.c.status]); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var k = ev.target.getAttribute('data-key'); if (!k) return;
    S.sim[k] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (S.modal) { S.modal = null; renderLayer(); } else if (closeFloating()) render(); }
    if (ev.key === '/' && S.view === 'builder' && !S.palette && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); S.palette = { stage: 'root' }; render(); }
    if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.achip.btn')) ev.target.click();
  });
  document.querySelectorAll('[data-view]').forEach(function (b) { b.addEventListener('click', function () { S.view = b.getAttribute('data-view'); closeFloating(); render(); }); });

  render();
})();
</script>
